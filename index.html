    const speakText = (text, lang = 'en-US', rate = 0.9) => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = rate;
      utter.pitch = lang.startsWith('en') ? 1.1 : 1.0;
      window.speechSynthesis.speak(utter);
    };

    const playEffect = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.45);
        } else {
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.35);
        }
      } catch (e) {}
    };

            score: 'Cố lên Max!',

          return;
        }
        const words = text.split(/\s+/);
        const lower = text.toLowerCase();
        const matchedKeywords = currentPrompt.keywords.filter(k => lower.includes(k));
        const hasCapital = /^[A-Z]/.test(text);
        const hasDot = /[.!?]$/.test(text);

        playEffect('correct');
        setStars(s => s + 10);
        if (shields < 15) setShields(sh => Math.min(15, sh + 1));

        let praise = `🌟 Great job, Max! Con đã viết được câu dài ${words.length} từ`;

          praise += ` và sử dụng rất tốt từ vựng: "${matchedKeywords.join(', ')}"!`;
        } else {
          praise += `!`;
        }

        let grammarNote = [];
        if (!hasCapital) grammarNote.push('Nhớ viết HOA chữ cái đầu câu nhé.');
        if (!hasDot) grammarNote.push('Nhớ đặt dấu chấm (.) ở cuối câu nhé.');
        if (grammarNote.length === 0) grammarNote.push('Chính tả và dấu câu của Max rất chuẩn xác!');

        speakText(`Fantastic work Max! Here is how you can level up to Cambridge Movers: ${currentPrompt.sampleMover}`, 'en-US', 0.92);

        setWriteReview({
          score: words.length >= 7 ? '🏆 Đạt chuẩn A1 Movers (+1 Khiên 🛡️)' : '⭐ Đạt chuẩn Starters (+1 Khiên 🛡️)',
          msg: praise,
          grammar: grammarNote.join(' '),
          starterTip: currentPrompt.sampleStarter,
          moverTip: currentPrompt.sampleMover
        });
      };

      // ------- MAX SPEAKING & LISTENING STATE -------
      const [speakSubMode, setSpeakSubMode] = useState('REX'); // 'REX' | 'LISTEN'
      const [rexIdx, setRexIdx] = useState(0);
      const [rexInput, setRexInput] = useState('');
      const [rexReply, setRexReply] = useState(null);
      const [isRecording, setIsRecording] = useState(false);
      const [listenIdx, setListenIdx] = useState(0);
      const [listenFeedback, setListenFeedback] = useState(null);

      const startVoiceCapture = (onResultCallback) => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert('Trình duyệt hiện tại chưa bật nhận diện giọng nói trực tiếp. Bé có thể bấm vào các nút câu mẫu hoặc gõ câu trả lời nhé!');
          return;
        }
        const rec = new SpeechRec();
        rec.lang = 'en-US';
        rec.interimResults = false;
        setIsRecording(true);
        rec.onresult = (e) => {
          const transcript = e.results[0][0].transcript;
          setIsRecording(false);
          onResultCallback(transcript);
        };
        rec.onerror = () => setIsRecording(false);
        rec.onend = () => setIsRecording(false);
        rec.start();
      };

      const handleRexAnswer = (spokenOrTyped) => {
        const text = (spokenOrTyped || rexInput).trim();

      // ------- MATH & VIET STATES (SHARED HELPER) -------
      const [maxMathIdx, setMaxMathIdx] = useState(0);
      const [maxMathMsg, setMaxMathMsg] = useState(null);
      const [maxVietIdx, setMaxVietIdx] = useState(0);
      const [maxVietMsg, setMaxVietMsg] = useState(null);

      const [winMathIdx, setWinMathIdx] = useState(0);
      const [winMathMsg, setWinMathMsg] = useState(null);
      const [winVietIdx, setWinVietIdx] = useState(0);
      const [winVietMsg, setWinVietMsg] = useState(null);

      return (
        <div className={`min-h-screen pb-16 transition-colors duration-300 ${
          profile === 'MAX'
            ? 'bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white'

                        {inputMode === 'LEGO' ? (

                            <div className="flex justify-center flex-wrap gap-2 min-h-[64px] p-4 rounded-2xl bg-slate-900/90 border-2 border-dashed border-slate-600">

                              </button>
                              <button
                                onClick={() => speakText(currentKitty.kittyVi, 'vi-VN', 1.0)}
                                className="px-4 py-2.5 rounded-2xl bg-amber-300 text-slate-900 font-black"
                              >
                                🇻🇳 Nghe dịch tiếng Việt
                              </button>
                            </div>
                          </div>
                        </div>

                        {/* Big Microphone Button for Win */}
                        <div className="text-center py-2">
                          <button
                            onClick={() => startVoiceCapture((text) => handleWinSpeakToKitty(text))}
                            className={`px-8 py-5 rounded-3xl font-black text-xl sm:text-2xl shadow-xl inline-flex items-center gap-3 transition-transform active:scale-95 ${
                              isRecording
                                ? 'bg-rose-500 text-white animate-pulse'
                                : 'bg-gradient-to-r from-emerald-400 to-teal-500 text-white'
                            }`}
                          >
                            <span className="text-3xl">🎙️</span>
                            <span>{isRecording ? 'Mèo Kitty đang nghe Win...' : 'BẤM ĐỂ WIN NÓI VỚI MÈO KITTY'}</span>
                          </button>
                        </div>

                        {/* Visual Suggestion Cards for 5yo */}
                        <div className="space-y-2">
                          <p className="text-center font-extrabold text-slate-700">
                            👇 Hoặc Win bấm nghe câu gợi ý rồi bấm chọn để trả lời Mèo Con nhé:
                          </p>
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            {currentKitty.suggestions.map((sug, i) => (
                              <div
                                key={i}
                                className="bg-white p-4 rounded-2xl border-2 border-pink-200 shadow flex flex-col justify-between gap-3 text-center"
                              >
                                <div className="text-4xl">{sug.emoji}</div>
                                <div className="font-black text-lg text-slate-900">"{sug.en}"</div>
                                <div className="text-xs font-bold text-slate-500">{sug.vi}</div>
                                <div className="flex gap-2 justify-center">
                                  <button
                                    onClick={() => speakText(sug.en, 'en-US', 0.8)}
                                    className="px-3 py-2 rounded-xl bg-sky-100 text-sky-900 font-black text-sm"
                                  >
                                    🔊 Nghe mẫu
                                  </button>
                                  <button
                                    onClick={() => handleWinSpeakToKitty(sug.en)}
                                    className="px-3 py-2 rounded-xl bg-pink-500 text-white font-black text-sm"
                                  >
                                    🗣️ Chọn nói câu này
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>

                        {kittyReply && (
                          <div className="p-4 rounded-2xl bg-emerald-100 border-2 border-emerald-400 text-emerald-950 font-black text-center text-lg">
                            {kittyReply}
                          </div>
                        )}

                        <div className="flex justify-center">
                          <button
                            onClick={() => { setKittyIdx(kittyIdx + 1); setKittyReply(null); }}
                            className="px-6 py-3 rounded-2xl bg-amber-400 text-slate-950 font-black text-base shadow"
                          >
                            🐾 Câu trò chuyện tiếp theo cùng Mèo Kitty ➡️
                          </button>
                        </div>
                      </div>
                    )}

                    {/* MODE 2: 5YO SENTENCE PRACTICE */}
                    {winEnMode === 'SENTENCE' && (
                      <div className="text-center space-y-5 py-3">
                        <div className="text-7xl">{WIN_SENTENCES_5YO[winSentIdx % WIN_SENTENCES_5YO.length].emoji}</div>
                        <h3 className="text-3xl font-black text-slate-900">
                          "{WIN_SENTENCES_5YO[winSentIdx % WIN_SENTENCES_5YO.length].en}"
                        </h3>
                        <p className="text-lg font-bold text-slate-600">
                          ({WIN_SENTENCES_5YO[winSentIdx % WIN_SENTENCES_5YO.length].vi})
                        </p>
                        <div className="flex justify-center gap-3 flex-wrap">
                          <button
                            onClick={() => speakText(WIN_SENTENCES_5YO[winSentIdx % WIN_SENTENCES_5YO.length].en, 'en-US', 0.78)}
                            className="px-6 py-4 rounded-2xl bg-sky-500 text-white font-black text-lg shadow-lg"
                          >
                            🔊 1. Nghe Đọc Mẫu Chậm
                          </button>
                          <button
                            onClick={() =>
                              startVoiceCapture((spoken) => {
                                playEffect('correct');
                                setStars(s => s + 5);
                                setWinSentFeedback(`🌟 Giỏi lắm Win ơi! Con vừa nói: "${spoken}" (+5 Sao)`);
                              })
                            }
                            className="px-6 py-4 rounded-2xl bg-emerald-500 text-white font-black text-lg shadow-lg"
                          >
                            🎙️ 2. Bấm Micro Để Win Nói Theo
                          </button>
                          <button
                            onClick={() => {
                              playEffect('correct');
                              setStars(s => s + 5);
                              speakText('Good job Win!', 'en-US', 0.9);
                              setWinSentFeedback('🌟 Tuyệt vời! Win đã đọc to câu tiếng Anh rất giỏi (+5 Sao)!');
                            }}
                            className="px-5 py-4 rounded-2xl bg-amber-400 text-slate-950 font-black text-lg shadow-lg"
                          >
                            ✅ Win Đã Đọc To Xong!
                          </button>
                        </div>
                        {winSentFeedback && (
                          <div className="p-4 rounded-2xl bg-emerald-100 text-emerald-900 font-black text-lg">
                            {winSentFeedback}
                          </div>
                        )}
                        <div>
                          <button
                            onClick={() => { setWinSentIdx(winSentIdx + 1); setWinSentFeedback(null); }}
                            className="px-6 py-3 rounded-2xl bg-slate-800 text-white font-black"
                          >
                            Mẫu câu tiếp theo ➡️
                          </button>
                        </div>
                      </div>
                    )}

                    {/* MODE 3: LISTEN & TOUCH FOR WIN */}
                    {winEnMode === 'TOUCH' && (
                      <div className="text-center space-y-5 py-3">
                        <button
                          onClick={() => speakText(WIN_VOCAB_TOUCH[winTouchIdx % WIN_VOCAB_TOUCH.length].word, 'en-US', 0.8)}
                          className="px-8 py-5 rounded-3xl bg-sky-500 text-white font-black text-2xl shadow-xl"
                        >
                          🔊 Bấm Nghe Từ: "{WIN_VOCAB_TOUCH[winTouchIdx % WIN_VOCAB_TOUCH.length].word}"
                        </button>
                        <p className="font-bold text-slate-600">
                          ({WIN_VOCAB_TOUCH[winTouchIdx % WIN_VOCAB_TOUCH.length].vi})
                        </p>
                        <div className="grid grid-cols-3 gap-4 max-w-lg mx-auto">
                          {WIN_VOCAB_TOUCH[winTouchIdx % WIN_VOCAB_TOUCH.length].choices.map((emo, i) => (
                            <button
                              key={i}
                              onClick={() => {
                                const cur = WIN_VOCAB_TOUCH[winTouchIdx % WIN_VOCAB_TOUCH.length];
                                if (emo === cur.emoji) {
                                  playEffect('correct');
                                  speakText(`Yes! ${cur.word}!`, 'en-US', 0.9);
                                  setStars(s => s + 5);
                                  setWinTouchMsg('🎉 Đúng rồi Win ơi! +5 Sao!');
                                } else {
                                  playEffect('wrong');
                                  setWinTouchMsg('Chưa đúng rồi, Win chạm hình khác nhé!');
                                }
                              }}
                              className="p-6 rounded-3xl bg-amber-50 hover:bg-amber-100 border-4 border-amber-300 text-6xl sm:text-7xl shadow-md"
                            >
                              {emo}
                            </button>
                          ))}
                        </div>
                        {winTouchMsg && (
                          <div className="text-xl font-black text-emerald-700">{winTouchMsg}</div>
                        )}
                        <button
                          onClick={() => { setWinTouchIdx(winTouchIdx + 1); setWinTouchMsg(null); }}
                          className="px-6 py-3 rounded-2xl bg-pink-500 text-white font-black"
                        >
                          Hình tiếp theo ➡️
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* WIN - MATH 5YO */}
                {winTab === 'MATH' && (
                  <div className="bg-white rounded-3xl p-6 border-4 border-amber-300 shadow-xl text-center space-y-5">
                    <button
                      onClick={() => speakText(WIN_MATH_5YO[winMathIdx % WIN_MATH_5YO.length].q, 'vi-VN', 1.0)}
                      className="px-6 py-3 rounded-2xl bg-amber-400 text-slate-950 font-black text-lg shadow"
                    >
                      🔊 Bấm Nghe Câu Hỏi Toán
                    </button>
                    <p className="text-2xl font-black text-slate-900">
                      {WIN_MATH_5YO[winMathIdx % WIN_MATH_5YO.length].q}
                    </p>
                    <div className="text-5xl sm:text-6xl py-4 bg-amber-50 rounded-3xl border-2 border-amber-200">
                      {WIN_MATH_5YO[winMathIdx % WIN_MATH_5YO.length].visual}
                    </div>
                    <div className="flex flex-wrap justify-center gap-4">
                      {WIN_MATH_5YO[winMathIdx % WIN_MATH_5YO.length].options.map((opt, i) => (
                        <button
                          key={i}
                          onClick={() => {
                            const cur = WIN_MATH_5YO[winMathIdx % WIN_MATH_5YO.length];
                            if (opt === cur.ans) {
                              playEffect('correct');
                              speakText('Hoan hô Win trả lời đúng rồi!', 'vi-VN', 1.0);
                              setStars(s => s + 5);
                              setWinMathMsg('🎉 Hoan hô Win giỏi quá! +5 Sao!');
                            } else {
                              playEffect('wrong');
                              setWinMathMsg('Win đếm lại cùng Mèo Con nhé!');
                            }
                          }}
                          className="px-8 py-5 rounded-3xl bg-sky-500 hover:bg-sky-400 text-white font-black text-2xl sm:text-3xl shadow-lg"
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                    {winMathMsg && <div className="text-xl font-black text-emerald-600">{winMathMsg}</div>}
                    <div>
                      <button
                        onClick={() => { setWinMathIdx(winMathIdx + 1); setWinMathMsg(null); }}
                        className="px-6 py-3 rounded-2xl bg-slate-800 text-white font-black"
                      >
                        Bài tiếp theo ➡️
                      </button>
                    </div>
                  </div>
                )}

                {/* WIN - VIETNAMESE 5YO */}
                {winTab === 'VIET' && (
                  <div className="bg-white rounded-3xl p-6 border-4 border-emerald-300 shadow-xl text-center space-y-5">
                    <button
                      onClick={() => speakText(WIN_VIET_5YO[winVietIdx % WIN_VIET_5YO.length].q, 'vi-VN', 1.0)}
                      className="px-6 py-3 rounded-2xl bg-emerald-500 text-white font-black text-lg shadow"
                    >
                      🔊 Bấm Nghe Câu Hỏi Chữ Cái
                    </button>
                    <p className="text-2xl font-black text-slate-900">
                      {WIN_VIET_5YO[winVietIdx % WIN_VIET_5YO.length].q}
                    </p>
                    <div className="text-5xl sm:text-6xl py-4 bg-emerald-50 rounded-3xl border-2 border-emerald-200 font-black">
                      {WIN_VIET_5YO[winVietIdx % WIN_VIET_5YO.length].visual}
                    </div>
                    <div className="flex flex-wrap justify-center gap-4">
                      {WIN_VIET_5YO[winVietIdx % WIN_VIET_5YO.length].options.map((opt, i) => (
                        <button
                          key={i}
                          onClick={() => {
                            const cur = WIN_VIET_5YO[winVietIdx % WIN_VIET_5YO.length];
                            if (opt === cur.ans) {
                              playEffect('correct');
                              speakText(cur.soundText, 'vi-VN', 1.0);
                              setStars(s => s + 5);
                              setWinVietMsg('🌟 Đúng rồi Win ơi! +5 Sao!');
                            } else {
                              playEffect('wrong');
                              setWinVietMsg('Thử lại nhé Win ơi!');
                            }
                          }}
                          className="px-7 py-5 rounded-3xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xl sm:text-2xl shadow-lg"
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                    {winVietMsg && <div className="text-xl font-black text-emerald-600">{winVietMsg}</div>}
                    <div>
                      <button
                        onClick={() => { setWinVietIdx(winVietIdx + 1); setWinVietMsg(null); }}
                        className="px-6 py-3 rounded-2xl bg-slate-800 text-white font-black"
                      >
                        Chữ tiếp theo ➡️
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* =================================================================
                SHARED REWARD CARDS COLLECTION (MAX & WIN)
               ================================================================= */}
            {profile === 'CARDS' && (
              <div className="space-y-6">
                <div className="text-center space-y-2">
                  <h2 className="text-3xl font-black text-amber-300">
                    🏆 Bộ Sưu Tập Thẻ Siêu Cấp Của Anh Em MAX & WIN
                  </h2>
                  <p className="text-slate-200 font-bold">
                    Dùng Sao ⭐ tích lũy được khi làm bài để mở khóa các siêu thẻ bài Khủng Long, Mèo Vũ Trụ, Robot Lego & Pokemon!
                  </p>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  {REWARD_CARDS.map((card) => {
                    const isUnlocked = unlockedCards.includes(card.id);
                    return (
                      <div
                        key={card.id}
                        className={`p-5 rounded-3xl border-2 flex flex-col justify-between gap-3 text-center transition-all ${
                          isUnlocked
                            ? 'bg-gradient-to-b from-indigo-800 to-slate-900 border-amber-400 shadow-xl'
                            : 'bg-slate-800/50 border-white/10 opacity-80'
                        }`}
                      >
                        <div className="text-6xl py-2">{isUnlocked ? card.emoji : '🔒'}</div>
                        <h3 className="text-xl font-black text-white">{card.name}</h3>
                        <p className="text-sm text-slate-300 font-semibold">{card.desc}</p>
                        {isUnlocked ? (
                          <span className="px-4 py-2 rounded-xl bg-emerald-500/20 text-emerald-300 font-black text-sm border border-emerald-400/40">
                            ✅ Đã Mở Khóa
                          </span>
                        ) : (
                          <button
                            onClick={() => {
                              if (stars >= card.cost) {
                                playEffect('correct');
                                setStars(stars - card.cost);
                                setUnlockedCards([...unlockedCards, card.id]);
                              } else {
                                alert(`Hai anh em cần thêm ${card.cost - stars} Sao ⭐ nữa để mở thẻ này nhé!`);
                              }
                            }}
                            className="px-4 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm shadow"
                          >
                            🔓 Đổi {card.cost} ⭐ để mở
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
